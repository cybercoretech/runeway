<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex">

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="/styles.css?v=1">
  <style>
    .over { min-height: 100svh; display: grid; place-content: center; gap: 22px; padding: 40px var(--gutter); text-align: center; }

    .over .vt { font-size: 24px; }

<body>
  <main class="over">
    <p class="vt">404 · NO LANE HERE</p>

    <div class="cta"><a class="btn btn-primary" href="/">▶ CONTINUE</a></div>
