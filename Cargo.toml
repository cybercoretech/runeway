[package]
name = "runeway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A retro side-scrolling view of your running coding agents, in the terminal"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "runeway"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
